name: E-Commerce Flash Sale CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  # =========================================================================
  # 1. BUILD & TEST BACKEND MICROSERVICES (SPRING BOOT)
  # =========================================================================
  build-backend:
    name: Build & Test Backend Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot Microservices
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Download OpenTelemetry Java Agent
        run: |
          curl -sSL -o backend/opentelemetry-javaagent.jar https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/latest/download/opentelemetry-javaagent.jar

      - name: Upload Backend Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifacts
          path: |
            backend/eureka-server/target/*.jar
            backend/api-gateway/target/*.jar
            backend/product-service/target/*.jar
            backend/inventory-service/target/*.jar
            backend/order-service/target/*.jar
            backend/payment-service/target/*.jar
            backend/notification-service/target/*.jar
            backend/opentelemetry-javaagent.jar
          retention-days: 1

  # =========================================================================
  # 2. BUILD & TEST FRONTEND CLIENT (REACT + TS)
  # =========================================================================
  build-frontend:
    name: Build Frontend Client (React.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build React SPA
        run: |
          cd frontend
          npm install
          npm run build

  # =========================================================================
  # 3. BUILD DOCKER IMAGES & PUSH TO GHCR
  # =========================================================================
  docker-build-push:
    name: Build Docker Images & Push to GHCR
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download Backend Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-artifacts
          path: backend

      - name: Lowercase Repository Owner Name for Docker Tag
        run: |
          echo "IMAGE_PREFIX=$(echo "${{ github.repository_owner }}/flashsale" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Eureka Server Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/eureka-server/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-eureka-server:latest

      - name: Build & Push API Gateway Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/api-gateway/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api-gateway:latest

      - name: Build & Push Product Service Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/product-service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-product-service:latest

      - name: Build & Push Inventory Service Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/inventory-service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-inventory-service:latest

      - name: Build & Push Order Service Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/order-service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-order-service:latest

      - name: Build & Push Payment Service Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/payment-service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-payment-service:latest

      - name: Build & Push Notification Service Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/notification-service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-notification-service:latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          build-args: |
            VITE_KEYCLOAK_URL=https://auth-flashsale.quangs2.cloud

  # =========================================================================
  # 4. AUTOMATED DEPLOYMENT ON UBUNTU SERVER (VIA SELF-HOSTED RUNNER)
  # =========================================================================
  deploy-server:
    name: Deploy to Ubuntu Production Server (Self-Hosted Runner)
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy application on Ubuntu Server
        run: |
          cd /opt/ecommerce-system
          git fetch origin main
          git reset --hard origin/main
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose pull
          docker compose up -d --force-recreate --remove-orphans
          docker image prune -f
