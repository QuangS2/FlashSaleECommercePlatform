name: E-Commerce Flash Sale CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  # =========================================================================
  # 1. BUILD & TEST BACKEND MICROSERVICES (SPRING BOOT)
  # =========================================================================
  build-backend:
    name: Build & Test Backend Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot Microservices
        run: |
          cd backend
          mvn clean package -DskipTests

  # =========================================================================
  # 2. BUILD & TEST FRONTEND CLIENT (REACT + TS)
  # =========================================================================
  build-frontend:
    name: Build Frontend Client (React.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build React SPA
        run: |
          cd frontend
          npm ci || npm install
          npm run build

  # =========================================================================
  # 3. BUILD DOCKER IMAGES & PUSH TO GHCR
  # =========================================================================
  docker-build-push:
    name: Build Docker Images & Push to GHCR
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner Name for Docker Tag
        run: |
          echo "IMAGE_PREFIX=$(echo "${{ github.repository_owner }}/flashsale" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/api-gateway
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api-gateway:latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest

  # =========================================================================
  # 4. AUTOMATED DEPLOYMENT ON UBUNTU SERVER (VIA SELF-HOSTED RUNNER)
  # =========================================================================
  deploy-server:
    name: Deploy to Ubuntu Production Server (Self-Hosted Runner)
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Deploy application on Ubuntu Server
        run: |
          cd /opt/ecommerce-system
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
