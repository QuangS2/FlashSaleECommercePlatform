name: Build and Push Docker Images to GHCR

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: quangs2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: eureka-server
            context: backend/eureka-server
            image: flashsale-eureka-server
          - service: api-gateway
            context: backend/api-gateway
            image: flashsale-api-gateway
          - service: product-service
            context: backend/product-service
            image: flashsale-product-service
          - service: inventory-service
            context: backend/inventory-service
            image: flashsale-inventory-service
          - service: order-service
            context: backend/order-service
            image: flashsale-order-service
          - service: payment-service
            context: backend/payment-service
            image: flashsale-payment-service
          - service: notification-service
            context: backend/notification-service
            image: flashsale-notification-service
          - service: frontend
            context: frontend
            image: flashsale-frontend
            build_args: VITE_KEYCLOAK_URL=http://auth.flashale.quangs2.cloud
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args || '' }}
