version: '3.8'

services:
  # -------------------------------------------------------------------------
  # 1. MySQL 8.0 Database Server (Order, Inventory, Payment DBs)
  # -------------------------------------------------------------------------
  mysql-db:
    image: mysql:8.0
    container_name: ecommerce-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecommerce_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecommerce-net

  # -------------------------------------------------------------------------
  # 2. MongoDB 7.0 (Product Catalog Document Database)
  # -------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: ecommerce-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ecommerce-net

  # -------------------------------------------------------------------------
  # 3. Redis 7.0 (Cache & Redisson Distributed Lock)
  # -------------------------------------------------------------------------
  redis:
    image: redis:7.0-alpine
    container_name: ecommerce-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-net

  # -------------------------------------------------------------------------
  # 4. Apache Kafka & Zookeeper (Async Order Message Queue)
  # -------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ecommerce-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - ecommerce-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ecommerce-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - ecommerce-net

  # -------------------------------------------------------------------------
  # 5. Keycloak IAM Server (OAuth2 / OIDC / PKCE Authentication)
  # -------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: ecommerce-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: adminpassword
      KC_HTTP_PORT: 8180
    ports:
      - "8180:8180"
    networks:
      - ecommerce-net

volumes:
  mysql_data:
  mongo_data:
  redis_data:

networks:
  ecommerce-net:
    driver: bridge
