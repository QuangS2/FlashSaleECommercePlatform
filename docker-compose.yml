version: '3.8'

services:
  # -------------------------------------------------------------------------
  # 1. MySQL 8.0 Database Server (Order, Inventory, Payment DBs)
  # -------------------------------------------------------------------------
  mysql-db:
    image: mysql:8.0
    container_name: ecommerce-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ecommerce_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # 2. MongoDB 7.0 (Product Catalog Document Database)
  # -------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: ecommerce-mongo
    volumes:
      - mongo_data:/data/db
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------------------
  # 3. Redis 7.0 (Cache & Redisson Distributed Lock)
  # -------------------------------------------------------------------------
  redis:
    image: redis:7.0-alpine
    container_name: ecommerce-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # 4. Apache Kafka & Zookeeper (Async Order Message Queue)
  # -------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ecommerce-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ecommerce-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------------------
  # 5. Keycloak IAM Server (OAuth2 / OIDC / PKCE Authentication)
  # -------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: ecommerce-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-adminpassword}
      KC_HTTP_PORT: 8180
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: auth.flashale.quangs2.cloud
    networks:
      - ecommerce-net
      - shared-infra-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ecommerce-auth.rule=Host(`auth.flashale.quangs2.cloud`)"
      - "traefik.http.services.ecommerce-auth.loadbalancer.server.port=8180"
      - "traefik.docker.network=shared-infra-net"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # APPLICATION SERVICES (SPRING BOOT MICROSERVICES & REACT FRONTEND)
  # =========================================================================

  # 6. Eureka Discovery Server (Port 8761)
  eureka-server:
    build:
      context: ./backend/eureka-server
      dockerfile: Dockerfile
    image: ghcr.io/quangs2/flashsale-eureka-server:latest
    container_name: ecommerce-eureka
    environment:
      - OTEL_SERVICE_NAME=ecommerce-eureka-server
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_METRICS_EXPORTER=none
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 512M

  # 7. Spring Cloud API Gateway (Port 8080)
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    image: ghcr.io/quangs2/flashsale-api-gateway:latest
    container_name: ecommerce-api-gateway
    environment:
      - OTEL_SERVICE_NAME=ecommerce-api-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_METRICS_EXPORTER=none
      - EUREKA_SERVER=http://eureka-server:8761/eureka/
      - KEYCLOAK_URL=http://keycloak:8180
    depends_on:
      - eureka-server
      - keycloak
    networks:
      - ecommerce-net
      - shared-infra-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ecommerce-api.rule=Host(`flashale-api.quangs2.cloud`)"
      - "traefik.http.services.ecommerce-api.loadbalancer.server.port=8080"
      - "traefik.docker.network=shared-infra-net"
    deploy:
      resources:
        limits:
          memory: 512M

  # 8. Product Service (Port 8081)
  product-service:
    build:
      context: ./backend/product-service
      dockerfile: Dockerfile
    image: ghcr.io/quangs2/flashsale-product-service:latest
    container_name: ecommerce-product-service
    environment:
      - OTEL_SERVICE_NAME=ecommerce-product-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_METRICS_EXPORTER=none
      - EUREKA_SERVER=http://eureka-server:8761/eureka/
      - MONGODB_URI=mongodb://mongodb:27017/ecommerce_product
      - REDIS_HOST=redis
    depends_on:
      - eureka-server
      - mongodb
      - redis
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 512M

  # 9. Inventory Service (Port 8082)
  inventory-service:
    build:
      context: ./backend/inventory-service
      dockerfile: Dockerfile
    image: ghcr.io/quangs2/flashsale-inventory-service:latest
    container_name: ecommerce-inventory-service
    environment:
      - OTEL_SERVICE_NAME=ecommerce-inventory-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_METRICS_EXPORTER=none
      - EUREKA_SERVER=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/ecommerce_db?useSSL=false&allowPublicKeyRetrieval=true
      - REDIS_HOST=redis
      - KAFKA_HOST=kafka:9092
    depends_on:
      - eureka-server
      - mysql-db
      - redis
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 512M

  # 10. Order Service (Port 8083)
  order-service:
    build:
      context: ./backend/order-service
      dockerfile: Dockerfile
    image: ghcr.io/quangs2/flashsale-order-service:latest
    container_name: ecommerce-order-service
    environment:
      - OTEL_SERVICE_NAME=ecommerce-order-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_METRICS_EXPORTER=none
      - EUREKA_SERVER=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/ecommerce_db?useSSL=false&allowPublicKeyRetrieval=true
      - KAFKA_HOST=kafka:9092
    depends_on:
      - eureka-server
      - mysql-db
      - kafka
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 512M

  # 11. Payment Service (Port 8084)
  payment-service:
    build:
      context: ./backend/payment-service
      dockerfile: Dockerfile
    image: ghcr.io/quangs2/flashsale-payment-service:latest
    container_name: ecommerce-payment-service
    environment:
      - OTEL_SERVICE_NAME=ecommerce-payment-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_METRICS_EXPORTER=none
      - EUREKA_SERVER=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/ecommerce_db?useSSL=false&allowPublicKeyRetrieval=true
      - KAFKA_HOST=kafka:9092
    depends_on:
      - eureka-server
      - mysql-db
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 512M

  # 12. Notification Service (Port 8085)
  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    image: ghcr.io/quangs2/flashsale-notification-service:latest
    container_name: ecommerce-notification-service
    environment:
      - OTEL_SERVICE_NAME=ecommerce-notification-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_METRICS_EXPORTER=none
      - EUREKA_SERVER=http://eureka-server:8761/eureka/
      - KAFKA_HOST=kafka:9092
    depends_on:
      - eureka-server
      - kafka
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 512M

  # 13. Frontend React SPA (Port 3000)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_URL: http://auth.flashale.quangs2.cloud
    image: ghcr.io/quangs2/flashsale-frontend:latest
    container_name: ecommerce-frontend-web
    networks:
      - ecommerce-net
      - shared-infra-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ecommerce-web.rule=Host(`flashale.quangs2.cloud`)"
      - "traefik.http.services.ecommerce-web.loadbalancer.server.port=80"
      - "traefik.docker.network=shared-infra-net"
    deploy:
      resources:
        limits:
          memory: 256M

  # 14. Jaeger All-in-one (Observability)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ecommerce-jaeger
    networks:
      - ecommerce-net

volumes:
  mysql_data:
  mongo_data:
  redis_data:

networks:
  ecommerce-net:
    driver: bridge
  shared-infra-net:
    external: true
