version: '3.8'

services:
  # -------------------------------------------------------------------------
  # 1. MySQL 8.0 Database Server (Order, Inventory, Payment DBs)
  # -------------------------------------------------------------------------
  mysql-db:
    image: mysql:8.0
    container_name: ecommerce-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ecommerce_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -------------------------------------------------------------------------
  # 2. MongoDB 7.0 (Product Catalog Document Database)
  # -------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: ecommerce-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------------------
  # 3. Redis 7.0 (Cache & Redisson Distributed Lock)
  # -------------------------------------------------------------------------
  redis:
    image: redis:7.0-alpine
    container_name: ecommerce-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------------------
  # 4. Apache Kafka & Zookeeper (Async Order Message Queue)
  # -------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ecommerce-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(echo > /dev/tcp/127.0.0.1/2181) >/dev/null 2>&1' || cub zk-ready zookeeper:2181 5 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ecommerce-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms256m -Xmx512m -XX:MetaspaceSize=96m"
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(echo > /dev/tcp/127.0.0.1/9092) >/dev/null 2>&1' || cub kafka-ready -b 127.0.0.1:9092 1 5 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init-topics:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ecommerce-kafka-init-topics
    depends_on:
      - kafka
    networks:
      - ecommerce-net
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      echo 'Chờ Kafka Broker sẵn sàng...'
      cub kafka-ready -b kafka:29092 1 30

      echo 'Khởi tạo các Production Kafka Topics với 3 Partitions...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic order-events --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic inventory-events --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic payment-events --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic notification-events --partitions 3 --replication-factor 1

      echo 'Danh sách Topics đã khởi tạo:'
      kafka-topics --bootstrap-server kafka:29092 --list
      "

  # -------------------------------------------------------------------------
  # 5. Keycloak IAM Server (OAuth2 / OIDC / PKCE Authentication)
  # -------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: ecommerce-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-adminpassword}
      KC_HTTP_PORT: 8180
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/ecommerce-realm.json:/opt/keycloak/data/import/ecommerce-realm.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # APPLICATION SERVICES (SPRING BOOT MICROSERVICES & REACT FRONTEND)
  # =========================================================================

  # 6. Eureka Discovery Server (Port 8761)
  eureka-server:
    image: ${IMAGE_PREFIX:-ghcr.io/quangs2/flashsale}-eureka-server:latest
    container_name: ecommerce-eureka
    environment:
      - OTEL_SERVICE_NAME=ecommerce-eureka-server
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_METRICS_EXPORTER=none
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-false}
      - EUREKA_HOSTNAME=${EUREKA_HOSTNAME:-eureka-server}
    ports:
      - "8761:8761"
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 512M

  # 7. Spring Cloud API Gateway (Port 8080)
  api-gateway:
    image: ${IMAGE_PREFIX:-ghcr.io/quangs2/flashsale}-api-gateway:latest
    container_name: ecommerce-api-gateway
    environment:
      - OTEL_SERVICE_NAME=ecommerce-api-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_METRICS_EXPORTER=none
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-false}
      - EUREKA_SERVER=http://eureka-server:8761/eureka/
      - KEYCLOAK_URL=http://keycloak:8180
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - keycloak
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 512M

  # 8. Product Service (Port 8081)
  product-service:
    image: ${IMAGE_PREFIX:-ghcr.io/quangs2/flashsale}-product-service:latest
    container_name: ecommerce-product-service
    environment:
      - OTEL_SERVICE_NAME=ecommerce-product-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_METRICS_EXPORTER=none
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-false}
      - EUREKA_SERVER=http://eureka-server:8761/eureka/
      - MONGODB_URI=mongodb://mongodb:27017/ecommerce_product
      - REDIS_HOST=redis
    depends_on:
      eureka-server:
        condition: service_started
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 512M

  # 9. Inventory Service (Port 8082)
  inventory-service:
    image: ${IMAGE_PREFIX:-ghcr.io/quangs2/flashsale}-inventory-service:latest
    container_name: ecommerce-inventory-service
    environment:
      - OTEL_SERVICE_NAME=ecommerce-inventory-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_METRICS_EXPORTER=none
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-false}
      - EUREKA_SERVER=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/ecommerce_db?useSSL=false&allowPublicKeyRetrieval=true
      - REDIS_HOST=redis
      - KAFKA_HOST=kafka:29092
    depends_on:
      eureka-server:
        condition: service_started
      mysql-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8082:8082"
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 512M

  # 10. Order Service (Port 8083)
  order-service:
    image: ${IMAGE_PREFIX:-ghcr.io/quangs2/flashsale}-order-service:latest
    container_name: ecommerce-order-service
    environment:
      - OTEL_SERVICE_NAME=ecommerce-order-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_METRICS_EXPORTER=none
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-false}
      - EUREKA_SERVER=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/ecommerce_db?useSSL=false&allowPublicKeyRetrieval=true
      - KAFKA_HOST=kafka:29092
    depends_on:
      eureka-server:
        condition: service_started
      mysql-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 512M

  # 11. Payment Service (Port 8084)
  payment-service:
    image: ${IMAGE_PREFIX:-ghcr.io/quangs2/flashsale}-payment-service:latest
    container_name: ecommerce-payment-service
    environment:
      - OTEL_SERVICE_NAME=ecommerce-payment-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_METRICS_EXPORTER=none
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-false}
      - EUREKA_SERVER=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/ecommerce_db?useSSL=false&allowPublicKeyRetrieval=true
      - KAFKA_HOST=kafka:29092
    depends_on:
      eureka-server:
        condition: service_started
      mysql-db:
        condition: service_healthy
    ports:
      - "8084:8084"
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 512M

  # 12. Notification Service (Port 8085)
  notification-service:
    image: ${IMAGE_PREFIX:-ghcr.io/quangs2/flashsale}-notification-service:latest
    container_name: ecommerce-notification-service
    environment:
      - OTEL_SERVICE_NAME=ecommerce-notification-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_METRICS_EXPORTER=none
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-false}
      - EUREKA_SERVER=http://eureka-server:8761/eureka/
      - KAFKA_HOST=kafka:29092
    depends_on:
      eureka-server:
        condition: service_started
      kafka:
        condition: service_healthy
    ports:
      - "8085:8085"
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 512M

  # 13. Frontend React SPA (Port 3000)
  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/quangs2/flashsale}-frontend:latest
    container_name: ecommerce-frontend-web
    ports:
      - "3000:80"
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 256M

  # 14. Jaeger All-in-one (Observability)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ecommerce-jaeger
    networks:
      - ecommerce-net

  # 15. Containerized Nginx Ingress Reverse Proxy (Unified Port 80 Entrypoint)
  nginx-ingress:
    image: nginx:alpine
    container_name: ecommerce-nginx-ingress
    restart: "no"
    ports:
      - "80:80"
    volumes:
      - ./nginx/ingress.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api-gateway
      - keycloak
    networks:
      - ecommerce-net
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  mysql_data:
  mongo_data:
  redis_data:

networks:
  ecommerce-net:
    driver: bridge
