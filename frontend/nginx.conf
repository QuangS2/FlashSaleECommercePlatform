# Preserve upstream X-Forwarded-Proto from Cloudflare/Edge SSL Terminator
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Preserve upstream X-Forwarded-Port from Cloudflare/Edge SSL Terminator
map $http_x_forwarded_port $forwarded_port {
    default $http_x_forwarded_port;
    ''      $server_port;
}

server {
    listen 80;
    server_name localhost;

    # Docker internal DNS resolver (không crash Nginx khi services backend chưa sẵn sàng)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 1. Phục vụ React SPA Frontend
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Chống lưu cache index.html để đảm bảo người dùng luôn tải UI/UX bản mới nhất
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Cache dài hạn cho static assets (JS/CSS có hash tên file từ Vite)
    location /assets/ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 2. Định tuyến REST API tới Spring Cloud API Gateway
    location /api/ {
        set $upstream_gateway http://api-gateway:8080;
        proxy_pass $upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
    }

    # 3. Định tuyến Real-time WebSocket & SockJS (Flash Sale Stock & Order Notification)
    location ~* ^/(ws|ws-notification)/ {
        set $upstream_gateway http://api-gateway:8080;
        proxy_pass $upstream_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 4. Chuyển tiếp xác thực Keycloak IAM (khi gọi qua subpath /auth/)
    location /auth/ {
        set $upstream_keycloak http://keycloak:8180;
        proxy_pass $upstream_keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
