# =============================================================================
# E-COMMERCE FLASH SALE PLATFORM - NGINX REVERSE PROXY VIRTUAL HOSTS CONFIG
# =============================================================================
# Hướng dẫn triển khai trên máy chủ Ubuntu/Debian:
# 1. Copy file này vào: /etc/nginx/sites-available/ecommerce.conf
# 2. Tạo symlink: sudo ln -s /etc/nginx/sites-available/ecommerce.conf /etc/nginx/sites-enabled/
# 3. Kiểm tra cú pháp: sudo nginx -t
# 4. Reload Nginx: sudo systemctl reload nginx
# 5. Cấp phát SSL tự động với Certbot:
#    sudo certbot --nginx -d flashsale.quangs2.cloud -d flashsale-api.quangs2.cloud -d auth.flashsale.quangs2.cloud
# =============================================================================

# Map để hỗ trợ WebSocket Connection Header tối ưu
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# -----------------------------------------------------------------------------
# 1. Frontend Web App (React Single Page Application)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name flashsale.quangs2.cloud flashale.quangs2.cloud;

    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# -----------------------------------------------------------------------------
# 2. Spring Cloud API Gateway & Real-time WebSocket Service
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name flashsale-api.quangs2.cloud flashale-api.quangs2.cloud;

    client_max_body_size 50M;

    # REST APIs & Health Check Endpoints
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Real-time WebSocket & SockJS Endpoints (/ws, /ws-notification)
    location ~* ^/(ws|ws-notification)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket Long-lived Connection Timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# -----------------------------------------------------------------------------
# 3. Keycloak IAM Server (OAuth2 / OIDC / PKCE Authentication)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name auth.flashsale.quangs2.cloud auth.flashale.quangs2.cloud;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;

        # Reverse Proxy Headers for Keycloak (KC_PROXY_HEADERS: xforwarded)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts for Auth Flows
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;

        # Buffer settings
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
