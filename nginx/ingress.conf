# =============================================================================
# E-COMMERCE FLASH SALE PLATFORM - CONTAINERIZED NGINX INGRESS REVERSE PROXY
# =============================================================================
# Hoạt động tự động 100% bên trong Docker Stack (Zero Configuration on Host OS)
# =============================================================================

# Map WebSocket Connection upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker internal DNS resolver (không crash Nginx khi upstream services đang khởi động)
resolver 127.0.0.11 valid=30s ipv6=off;

# -----------------------------------------------------------------------------
# 1. Frontend Web App (React Single Page Application)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name flashsale.quangs2.cloud flashale.quangs2.cloud localhost "";

    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    location / {
        set $upstream_frontend http://frontend:80;
        proxy_pass $upstream_frontend;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# -----------------------------------------------------------------------------
# 2. Spring Cloud API Gateway & Real-time WebSocket Service
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name flashsale-api.quangs2.cloud flashale-api.quangs2.cloud;

    client_max_body_size 50M;

    # REST APIs & Health Check Endpoints
    location / {
        set $upstream_gateway http://api-gateway:8080;
        proxy_pass $upstream_gateway;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Real-time WebSocket & SockJS Endpoints (/ws, /ws-notification)
    location ~* ^/(ws|ws-notification)/ {
        set $upstream_gateway http://api-gateway:8080;
        proxy_pass $upstream_gateway;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket Long-lived Connection Timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# -----------------------------------------------------------------------------
# 3. Keycloak IAM Server (OAuth2 / OIDC / PKCE Authentication)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name auth-flashsale.quangs2.cloud auth-flashale.quangs2.cloud auth.flashsale.quangs2.cloud auth.flashale.quangs2.cloud;

    client_max_body_size 20M;

    location / {
        set $upstream_keycloak http://keycloak:8180;
        proxy_pass $upstream_keycloak;
        proxy_http_version 1.1;

        # Reverse Proxy Headers for Keycloak (KC_PROXY_HEADERS: xforwarded)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts for Auth Flows
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;

        # Buffer settings
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
